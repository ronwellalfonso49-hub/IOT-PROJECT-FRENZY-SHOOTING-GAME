<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Frenzy{% endblock %} - IoT Target Shooting</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('pages.dashboard') }}" class="logo">
                <span class="logo-icon">&#127919;</span>
                <span class="logo-text">FRENZY</span>
            </a>
            <nav class="nav-links">
                <a href="{{ url_for('pages.dashboard') }}">Dashboard</a>
                <a href="{{ url_for('pages.round_results') }}">Rounds</a>
                <a href="{{ url_for('pages.final_results') }}">Results</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Frenzy &copy; 2026 - IoT Target Shooting Game</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
